- name: Add repo configuration
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: 0600
  with_items:
    - "{{ repo_template_file }}"
  when: ansible_distribution_release is regex('focal')

- name: Install podman repo release key
  apt_key:
    url: "{{ release_key_url }}"
    state: present
  when: ansible_distribution_release is regex('focal')

- name: Update APT cache
  apt:
    update_cache: yes
  changed_when: false

